name: Daytrading Market Signals

on:
  schedule:
    - cron: '0 6 * * *'   # 8:00 Uhr Sommerzeit
    - cron: '0 7 * * *'   # 8:00 Uhr Winterzeit
    - cron: '30 13 * * *' # 15:30 Uhr Sommerzeit
    - cron: '30 14 * * *' # 15:30 Uhr Winterzeit
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Nachricht unabhängig von der Uhrzeit senden (zum Testen)'
        type: boolean
        default: true

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Signale prüfen und senden
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
        run: python daily_signals.py
